{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photoghor Gallery</title>

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    background:#000;
    padding:18px 40px;
    position:relative;
    z-index:10000;
}

.header-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* =========================
   LOGO
========================= */

.logo{
    color:#fff;
    font-size:26px;
    font-weight:800;
    letter-spacing:4px;
    z-index:10001;
    position:relative;
}

/* =========================
   MENU BUTTON
========================= */

.menu-btn{
    color:#fff;
    font-size:30px;
    cursor:pointer;
    z-index:10001;
    position:relative;
}

/* =========================
   MENU
========================= */

.nav-menu{

    position:fixed;

    top:0;
    right:-100%;

    width:100%;
    height:80px;

    background:#000;

    padding:0 100px 0 40px;

    list-style:none;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:55px;

    transition:0.4s ease;

    z-index:9999;
}

/* SHOW MENU */

.nav-menu.show{
    right:0;
}

/* MENU LINKS */

.nav-menu li{
    list-style:none;
}

.nav-menu li a{

    color:#fff;

    text-decoration:none;

    font-size:15px;

    font-weight:700;

    text-transform:uppercase;

    transition:0.3s;
}

.nav-menu li a:hover{
    color:#999;
}

/* =========================
   CLOSE BUTTON
========================= */

.close-btn{

    position:absolute;

    top:20px;
    right:20px;

    width:40px;
    height:40px;

    border-radius:8px;

    background:#222;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:22px;

    cursor:pointer;

    z-index:10001;
}

.close-btn:hover{
    background:#333;
}

/* =========================
   GALLERY
========================= */

.gallery{

    width:90%;

    margin:40px auto;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

.gallery-item{
    overflow:hidden;
    border-radius:12px;
}

.gallery-item img{

    width:100%;

    height:260px;

    object-fit:cover;

    transition:0.4s;

    display:block;
}

.gallery-item:hover img{
    transform:scale(1.1);
}

/* =========================
   TABLET
========================= */

@media(max-width:992px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .header{
        padding:18px 20px;
    }

    .logo{
        font-size:18px;
        letter-spacing:2px;
    }

    .nav-menu{

        width:280px;

        height:100vh;

        top:0;
        right:-100%;

        flex-direction:column;

        align-items:flex-start;

        justify-content:flex-start;

        padding:100px 25px 40px;

        gap:30px;
    }

    .nav-menu.show{
        right:0;
    }

    .nav-menu li{
        width:100%;
    }

    .nav-menu li a{

        display:block;

        width:100%;

        padding-bottom:15px;

        border-bottom:1px solid rgba(255,255,255,0.1);

        font-size:18px;
    }

    .close-btn{
        top:30px;
        right:20px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .gallery-item img{
        height:220px;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-content">

        <!-- LOGO -->

        <div class="logo">
            PHOTOGHOR
        </div>

        <!-- MENU BUTTON -->

        <div class="menu-btn" onclick="toggleMenu()">

            <i class="fa-solid fa-bars"></i>

        </div>

    </div>

    <!-- MENU -->

    <ul class="nav-menu" id="navMenu">

        <!-- CLOSE BUTTON -->

        <div class="close-btn" onclick="toggleMenu()">

            <i class="fa-solid fa-xmark"></i>

        </div>

        <li>
            <a href="{% url 'index' %}">
                HOME
            </a>
        </li>

        <li>
            <a href="{% url 'home' %}">
                PHOTO GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                1 COLUMN GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                2 COLUMN GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                4 COLUMN GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                PHOTO DETAILS
            </a>
        </li>

    </ul>

</header>

<!-- =========================
     GALLERY
========================= -->

<section class="gallery">

    {% for photo in photos %}

    <div class="gallery-item">

        <img src="{{ photo.image.url }}"
             alt="{{ photo.title }}">

    </div>

    {% endfor %}

</section>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

function toggleMenu(){

    document
    .getElementById("navMenu")
    .classList
    .toggle("show");

}

</script>

</body>
</html>
