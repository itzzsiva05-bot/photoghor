{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#111;
            color:white;
        }

        /* ================= HEADER ================= */

        .header{
            background:#000;
            padding:15px 20px;
            position:relative;
        }

        .header-content{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        /* ================= HAMBURGER BUTTON ================= */

        .menu-btn{
            font-size:30px;
            color:white;
            cursor:pointer;
        }

        /* ================= MENU ================= */

        .nav-menu{
            position:absolute;
            top:70px;
            right:20px;

            width:220px;
            background:#222;

            border-radius:10px;
            padding:20px;

            list-style:none;

            display:none;
            flex-direction:column;
            gap:15px;
        }

        .nav-menu.show{
            display:flex;
        }

        .nav-menu li a{
            color:white;
            text-decoration:none;
            font-size:18px;
        }

        .nav-menu li a:hover{
            color:orange;
        }

        /* ================= GALLERY ================= */

        .gallery{
            width:90%;
            margin:40px auto;

            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .gallery img{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:10px;
        }

        /* ================= MOBILE ================= */

        @media(max-width:768px){

            .gallery{
                grid-template-columns:repeat(2,1fr);
            }

            .gallery img{
                height:180px;
            }

        }

    </style>
</head>
<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-content">

            <div class="logo">
                PHOTO GALLERY
            </div>

            <!-- HAMBURGER BUTTON -->

            <div class="menu-btn" onclick="toggleMenu()">

                <i class="fa-solid fa-bars"></i>

            </div>

        </div>

        <!-- MENU OPTIONS -->

        <ul class="nav-menu" id="navMenu">

            <li>
                <a href="{% url 'index' %}">Home</a>
            </li>

            <li>
                <a href="{% url 'home' %}">Gallery</a>
            </li>

            <li>
                <a href="{% url 'register' %}">Register</a>
            </li>

            <li>
                <a href="{% url 'logout' %}">Logout</a>
            </li>

        </ul>

    </header>

    <!-- ================= GALLERY ================= -->

    <section class="gallery">

        {% for photo in photos %}

            <img src="{{ photo.image.url }}" alt="{{ photo.title }}">

        {% endfor %}

    </section>

    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function toggleMenu(){

            document
            .getElementById("navMenu")
            .classList
            .toggle("show");

        }

    </script>

</body>
</html>
