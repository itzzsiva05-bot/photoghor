<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        .gallery{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
        }

        .img-box img{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:8px;
        }

        @media(max-width:768px){
            .gallery{
                grid-template-columns:repeat(2,1fr);
            }
        }

        @media(max-width:480px){
            .gallery{
                grid-template-columns:repeat(1,1fr);
            }
        }
    </style>
</head>

<body>

<h2>Photo Gallery</h2>

<div class="gallery">
    {% for photo in photos %}
        <div class="img-box">
            <img src="{{ photo.image.url }}">
        </div>
    {% endfor %}
</div>

</body>
</html>
