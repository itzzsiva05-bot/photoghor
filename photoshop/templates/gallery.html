{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photoghor Gallery</title>

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    background:#000;
    padding:20px 40px;
    position:sticky;
    top:0;
    z-index:9999;
}

.header-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* =========================
   LOGO
========================= */

.logo{
    font-size:24px;
    font-weight:bold;
    letter-spacing:4px;
}

/* =========================
   MENU BUTTON
========================= */

.menu-btn{
    font-size:30px;
    color:#fff;
    cursor:pointer;
}

/* =========================
   MENU
========================= */

.nav-menu{

    display:none;

    position:absolute;

    top:80px;
    right:40px;

    width:320px;

    background:#000;

    padding:25px;

    border-radius:12px;

    list-style:none;

    flex-direction:column;

    gap:25px;

    z-index:9999;
}

/* SHOW MENU */

.nav-menu.show{
    display:flex;
}

/* MENU LINKS */

.nav-menu li{
    width:100%;
}

.nav-menu li a{

    display:block;

    width:100%;

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:bold;

    padding-bottom:15px;

    border-bottom:1px solid rgba(255,255,255,0.1);

    transition:0.3s;
}

.nav-menu li a:hover{
    color:#aaa;
}

/* =========================
   CLOSE BUTTON
========================= */

.close-btn{

    position:absolute;

    top:15px;
    right:15px;

    width:40px;
    height:40px;

    background:#222;

    border-radius:8px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;

    cursor:pointer;
}

/* =========================
   GALLERY
========================= */

.gallery{

    width:90%;

    margin:40px auto;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

.gallery-item{
    overflow:hidden;
    border-radius:12px;
}

.gallery-item img{

    width:100%;

    height:260px;

    object-fit:cover;

    transition:0.4s;

    display:block;
}

.gallery-item:hover img{
    transform:scale(1.1);
}

/* =========================
   TABLET
========================= */

@media(max-width:992px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .header{
        padding:18px 20px;
    }

    .logo{
        font-size:18px;
        letter-spacing:2px;
    }

    .nav-menu{

        width:280px;

        right:20px;

        top:75px;
    }

    .nav-menu li a{
        font-size:16px;
    }

    .gallery{
        grid-template-columns:1fr;
        gap:15px;
    }

    .gallery-item img{
        height:240px;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-content">

        <!-- LOGO -->

        <div class="logo">
            PHOTOGHOR
        </div>

        <!-- MENU BUTTON -->

        <div class="menu-btn" onclick="toggleMenu()">

            <i class="fa-solid fa-bars"></i>

        </div>

    </div>

    <!-- ================= MENU ================= -->

    <ul class="nav-menu" id="navMenu">

        <!-- CLOSE BUTTON -->

        <div class="close-btn" onclick="toggleMenu()">

            <i class="fa-solid fa-xmark"></i>

        </div>

        <li>
            <a href="{% url 'index' %}">
                HOME
            </a>
        </li>

        <li>
            <a href="{% url 'home' %}">
                PHOTO GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                1 COLUMN GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                2 COLUMN GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                4 COLUMN GALLERY
            </a>
        </li>

        <li>
            <a href="#">
                PHOTO DETAILS
            </a>
        </li>

    </ul>

</header>

<!-- =========================
     GALLERY
========================= -->

<section class="gallery">

    {% for photo in photos %}

    <div class="gallery-item">

        <img src="{{ photo.image.url }}"
             alt="{{ photo.title }}">

    </div>

    {% endfor %}

</section>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

function toggleMenu(){

    document
    .getElementById("navMenu")
    .classList
    .toggle("show");

}

</script>

</body>
</html>
