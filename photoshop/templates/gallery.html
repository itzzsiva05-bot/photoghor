{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Gallery</title>

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:80px;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    z-index:1000;
}

/* =========================
   LOGO
========================= */

.logo{
    color:#fff;
    font-size:28px;
    font-weight:700;
    letter-spacing:4px;
}

/* =========================
   MENU BUTTON
========================= */

.menu-toggle{
    width:50px;
    height:50px;

    border:none;
    background:none;

    color:#fff;
    font-size:28px;

    cursor:pointer;
}

/* =========================
   NAVBAR
========================= */

.inline-nav{
    position:fixed;

    top:0;
    right:-100%;

    width:80%;
    height:80px;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    padding-right:60px;

    gap:20px;

    transition:0.4s ease;

    z-index:1001;
}

/* OPEN MENU */

.inline-nav.open{
    right:0;
}

/* =========================
   NAV LINKS
========================= */

.inline-nav a{
    color:#bfbfbf;
    text-decoration:none;

    font-size:15px;
    font-weight:600;

    white-space:nowrap;

    transition:0.3s;
}

.inline-nav a:hover{
    color:#fff;
}

/* =========================
   CLOSE BUTTON
========================= */

.nav-close-inline{
    position:absolute;

    top:20px;
    right:10px;

    width:38px;
    height:38px;

    border:none;
    border-radius:10px;

    background:#1d1d1d;
    color:#fff;

    font-size:15px;

    cursor:pointer;

    display:none;

    align-items:center;
    justify-content:center;
}

.nav-close-inline.visible{
    display:flex;
}

/* =========================
   GALLERY
========================= */

.gallery{
    width:100%;
    padding:120px 25px 40px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

/* =========================
   GALLERY ITEM
========================= */

.gallery-item{
    position:relative;
    overflow:hidden;

    border-radius:18px;

    background:#1a1a1a;
}

/* IMAGE */

.gallery-item img{
    width:100%;
    height:280px;

    object-fit:cover;

    display:block;

    cursor:pointer;

    transition:0.4s;
}

.gallery-item:hover img{
    transform:scale(1.05);
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100vh;

    background:rgba(0,0,0,0.95);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:5000;

    padding:20px;
}

/* ACTIVE */

.lightbox.active{
    display:flex;
}

/* IMAGE */

.lightbox img{
    max-width:95%;
    max-height:95vh;

    border-radius:12px;
}

/* CLOSE */

.lightbox-close{
    position:absolute;

    top:25px;
    right:30px;

    font-size:32px;
    color:#fff;

    cursor:pointer;
}

/* =========================
   MOBILE VIEW
========================= */

@media(max-width:950px){

    .inline-nav{
        flex-direction:column;
        justify-content:center;

        width:100%;
        min-width:100%;

        height:100vh;

        right:-100%;
        top:0;

        gap:35px;

        padding-left:0;
        padding-right:0;
    }

    .inline-nav.open{
        right:0;
    }

    .inline-nav a{
        font-size:18px;
    }

    .logo{
        font-size:24px;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
        padding:110px 15px 20px;
        gap:15px;
    }

    .gallery-item img{
        height:200px;
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:600px){

    .gallery{
        grid-template-columns:1fr;
    }

    .gallery-item img{
        height:260px;
    }

}

</style>
</head>
<body>

<!-- HEADER -->

<header>

    <div class="logo">
        PHOTOGHOR
    </div>

    <!-- MENU BUTTON -->

    <button class="menu-toggle"
            id="menu-toggle">

        <i class="fas fa-bars"></i>

    </button>

</header>

<!-- NAVIGATION -->

<nav class="inline-nav" id="inline-nav">

    <a href="#">HOME</a>
    <a href="#">PHOTO GALLERY</a>
    <a href="#">1 COLUMN GALLERY</a>
    <a href="#">2 COLUMN GALLERY</a>
    <a href="#">4 COLUMN GALLERY</a>
    <a href="#">PHOTO DETAILS</a>

    <!-- CLOSE BUTTON -->

    <button class="nav-close-inline"
            id="nav-close-inline">

        <i class="fas fa-times"></i>

    </button>

</nav>

<!-- GALLERY -->

<section class="gallery">

{% for photo in photos %}
<div class="gallery-item">
    <img src="{{ photo.image.url }}" onclick="openImage(this.src)" alt="gallery">
</div>
{% endfor %}
</section>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

    <span class="lightbox-close"
          onclick="closeImage()">

        <i class="fas fa-times"></i>

    </span>

    <img id="lightbox-img">

</div>

<!-- JAVASCRIPT -->

<script>

const menuToggle     = document.getElementById('menu-toggle');
const inlineNav      = document.getElementById('inline-nav');
const navCloseInline = document.getElementById('nav-close-inline');

/* OPEN MENU */

function openNav(){

    inlineNav.classList.add('open');

    navCloseInline.classList.add('visible');

}

/* CLOSE MENU */

function closeNav(){

    inlineNav.classList.remove('open');

    navCloseInline.classList.remove('visible');

}

/* BUTTON EVENTS */

menuToggle.addEventListener('click', openNav);

navCloseInline.addEventListener('click', closeNav);

/* CLOSE WHEN LINK CLICK */

inlineNav.querySelectorAll('a').forEach(a =>
    a.addEventListener('click', closeNav)
);

/* ESC CLOSE */

document.addEventListener('keydown', e => {

    if(e.key === 'Escape'){

        closeNav();
        closeImage();

    }

});

/* =========================
   IMAGE LIGHTBOX
========================= */

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

/* OPEN IMAGE */

function openImage(src){

    lightbox.classList.add('active');

    lightboxImg.src = src;

}

/* CLOSE IMAGE */

function closeImage(){

    lightbox.classList.remove('active');

}

/* CLICK OUTSIDE CLOSE */

lightbox.addEventListener('click', e => {

    if(e.target === lightbox){

        closeImage();

    }

});

</script>

</body>
</html>
