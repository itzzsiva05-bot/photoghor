{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Photoghor | Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            width:100%;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:30px;

            background-image:url('https://plus.unsplash.com/premium_photo-1720192861639-1524439fc166?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            position:relative;
        }

        /* ================= DARK OVERLAY ================= */

        body::before{
            content:"";
            position:absolute;
            inset:0;
            background:rgba(0,0,0,0.45);
        }

        /* ================= REGISTER BOX ================= */

        .box{
            width:100%;
            max-width:420px;

            background:rgba(255,255,255,0.10);

            border:1px solid rgba(255,255,255,0.20);

            backdrop-filter:blur(14px);

            padding:45px 35px;

            border-radius:22px;

            box-shadow:0 10px 35px rgba(0,0,0,0.35);

            position:relative;
            z-index:2;
        }

        /* ================= TITLE ================= */

        .logo{
            text-align:center;
            color:#fff;
            font-size:32px;
            font-weight:800;
            letter-spacing:2px;
            margin-bottom:10px;
        }

        .sub-title{
            text-align:center;
            color:#ddd;
            font-size:14px;
            margin-bottom:35px;
            letter-spacing:1px;
        }

        /* ================= INPUTS ================= */

        .input-group{
            margin-bottom:20px;
        }

        .input-group input{
            width:100%;
            padding:15px 18px;

            border:none;
            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.12);

            color:#fff;

            font-size:15px;
        }

        .input-group input::placeholder{
            color:#ddd;
        }

        /* ================= BUTTONS ================= */

        .register-btn{
            width:100%;

            padding:15px;

            border:none;
            border-radius:14px;

            background:#f3b14e;

            color:#111;

            font-size:16px;
            font-weight:700;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;
        }

        .register-btn:hover{
            background:#fff;
        }

        .back-btn{
            width:100%;

            padding:15px;

            border:none;
            border-radius:14px;

            background:rgba(0,0,0,0.35);

            color:#fff;

            font-size:15px;
            font-weight:700;

            cursor:pointer;

            transition:0.3s;

            margin-top:15px;
        }

        .back-btn:hover{
            background:rgba(0,0,0,0.55);
        }

        /* ================= LOGIN LINK ================= */

        .login-link{
            text-align:center;
            color:#ddd;
            margin-top:25px;
            font-size:14px;
        }

        .login-link a{
            color:#f3b14e;
            text-decoration:none;
            font-weight:700;
        }

        .login-link a:hover{
            color:#fff;
        }

        /* ================= MOBILE ================= */

        @media(max-width:576px){

            .box{
                padding:35px 25px;
            }

            .logo{
                font-size:28px;
            }
        }

    </style>

</head>

<body>

    <div class="box">

        <!-- TITLE -->

        <div class="logo">

            PHOTOGHOR

        </div>

        <div class="sub-title">

            CREATE YOUR ACCOUNT

        </div>

        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <!-- USERNAME -->

            <div class="input-group">

                <input type="text"
                       name="username"
                       placeholder="Create Username"
                       required>

            </div>

            <!-- EMAIL -->

            <div class="input-group">

                <input type="email"
                       name="email"
                       placeholder="Enter Email"
                       required>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <input type="password"
                       name="password"
                       placeholder="Create Password"
                       required>

            </div>

            <!-- REGISTER BUTTON -->

            <button type="submit"
                    class="register-btn">

                REGISTER

            </button>

        </form>

        <!-- BACK BUTTON -->

        <a href="{% url 'index' %}">

            <button type="button"
                    class="back-btn">

                ← Back To Login

            </button>

        </a>

        <!-- LOGIN LINK -->

        <div class="login-link">

            Already have an account?

            <a href="{% url 'index' %}">

                Login

            </a>

        </div>

    </div>

</body>

</html>
