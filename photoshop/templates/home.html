{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Photoghor Gallery</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */
.top-header{
    background:#111;
    color:#fff;
    padding:18px 0;
    position:sticky;
    top:0;
    z-index:999;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

.header-content{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

/* =========================
   MENU BUTTON
========================= */
.hamburger{
    display:flex;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
}

.bar{
    width:28px;
    height:2px;
    background:#fff;
    border-radius:2px;
}

/* =========================
   HERO
========================= */
.hero-banner{
    height:180px;
    background:url('https://www.shutterstock.com/image-photo/photographer-photographic-camera-dslr-photo-260nw-525066541.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
    display:flex;
    align-items:center;
}

.hero-banner::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.5);
}

.banner-container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:0 30px;
}

.banner-title{
    color:#fff;
    font-size:42px;
    font-weight:800;
}

.breadcrumbs{
    margin-top:10px;
    color:#fff;
    font-size:14px;
}

.breadcrumbs a{
    color:#fff;
    text-decoration:none;
}

/* =========================
   CATEGORY
========================= */
.menu-section{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding:40px 20px;
    flex-wrap:wrap;
}

.menu-section a{
    text-decoration:none;
    color:#111;
    border:2px solid #e0b04f;
    padding:12px 24px;
    border-radius:40px;
    font-size:14px;
    font-weight:700;
    transition:0.3s;
}

.menu-section a:hover,
.menu-section a.active{
    background:#e0b04f;
    color:#fff;
}

/* =========================
   GALLERY
========================= */
.gallery{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:12px;
}

.gallery-item img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
    transition:0.4s;
}

.gallery-item:hover img{
    transform:scale(1.05);
}

/* =========================
   OVERLAY
========================= */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    opacity:0;
    transition:0.4s;
}

.gallery-item:hover .overlay{
    opacity:1;
}

.overlay h3{
    color:#fff;
    font-size:13px;
    text-transform:uppercase;
}

/* =========================
   EYE ICON
========================= */
.icon{
    position:absolute;
    top:10px;
    right:10px;
    width:34px;
    height:34px;
    background:rgba(0,0,0,0.7);
    color:#fff;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
    transition:0.3s;
}

.icon:hover{
    background:#00f0ff;
    color:#000;
}

/* =========================
   LIGHTBOX
========================= */
.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    z-index:9999;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.lightbox.open{
    display:flex;
}

#lightbox-img{
    width:90%;
    max-width:900px;
    max-height:85vh;
    object-fit:contain;
    border-radius:10px;
}

/* =========================
   COUNTER
========================= */
#lb-counter{
    position:absolute;
    top:15px;
    left:20px;
    color:#fff;
    font-size:16px;
    font-weight:600;
}

/* =========================
   CLOSE BUTTON
========================= */
.lb-close{
    position:absolute;
    top:15px;
    right:20px;
    width:42px;
    height:42px;
    border:2px solid #00f0ff;
    background:transparent;
    color:#00f0ff;
    border-radius:8px;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.lb-close:hover{
    background:#00f0ff;
    color:#000;
}

/* =========================
   DOWNLOAD BUTTON
========================= */
#lb-download{
    position:absolute;
    top:15px;
    right:75px;
    width:42px;
    height:42px;
    border:2px solid #2563eb;
    color:#2563eb;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:18px;
    transition:0.3s;
}

#lb-download:hover{
    background:#2563eb;
    color:#fff;
}

/* =========================
   LOGIN BUTTON
========================= */
.lb-login-download{
    position:absolute;
    top:15px;
    right:75px;
    height:42px;
    padding:0 14px;
    border:1.5px solid #2563eb;
    border-radius:8px;
    color:#fff;
    background:rgba(37,99,235,0.15);
    text-decoration:none;
    display:flex;
    align-items:center;
    font-size:13px;
    transition:0.3s;
}

.lb-login-download:hover{
    background:#2563eb;
}

/* =========================
   ARROWS
========================= */
.lb-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:42px;
    color:#fff;
    cursor:pointer;
    padding:10px;
    user-select:none;
}

.lb-arrow.left{
    left:20px;
}

.lb-arrow.right{
    right:20px;
}

/* =========================
   MOBILE
========================= */
@media(max-width:768px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .gallery-item img{
        height:160px;
    }

    .banner-title{
        font-size:26px;
    }

    .icon{
        width:28px;
        height:28px;
        font-size:12px;
    }

    #lightbox-img{
        width:95%;
        max-height:65vh;
    }

    .lb-close{
        width:36px;
        height:36px;
        font-size:16px;
        top:10px;
        right:10px;
    }

    #lb-download{
        width:36px;
        height:36px;
        top:10px;
        right:55px;
    }

    .lb-login-download{
        height:36px;
        top:10px;
        right:55px;
        font-size:11px;
        padding:0 10px;
    }

    .lb-arrow{
        font-size:28px;
    }
}

@media(max-width:450px){

    .gallery{
        grid-template-columns:1fr;
    }

    .gallery-item img{
        height:220px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">
    <div class="container header-content">

        <div class="logo">PHOTOGHOR</div>

        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

    </div>
</header>

<!-- HERO -->
<header class="hero-banner">
    <div class="banner-container">

        <h1 class="banner-title">PHOTO GALLERY</h1>

        <div class="breadcrumbs">
            <a href="{% url 'index' %}">HOME</a> /
            PHOTO GALLERY
        </div>

    </div>
</header>

<!-- CATEGORY -->
<div class="menu-section">

    <a href="{% url 'home' %}"
       class="{% if not request.GET.category %}active{% endif %}">
       ALL
    </a>

    {% for category in categories %}
    <a href="{% url 'home' %}?category={{ category.name }}"
       class="{% if request.GET.category == category.name %}active{% endif %}">
       {{ category.name }}
    </a>
    {% endfor %}

</div>

<!-- GALLERY -->
<section class="gallery">

    {% for photo in photos %}

    <div class="gallery-item">

        <img src="{{ photo.image.url }}"
             alt="{{ photo.title }}"
             loading="lazy">

        <div class="overlay">
            <h3>{{ photo.title }}</h3>
        </div>

        <div class="icon"
             onclick="openImage('{{ photo.image.url }}')">

            <i class="fa-solid fa-eye"></i>

        </div>

    </div>

    {% endfor %}

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

    <!-- COUNTER -->
    <div id="lb-counter"></div>

    <!-- CLOSE -->
    <button class="lb-close"
            onclick="closeImage()">

        &#10005;

    </button>

    <!-- LOGIN CHECK -->
    {% if user.is_authenticated %}

        <!-- LOGIN SUCCESS -->
        <a id="lb-download"
           href=""
           download
           title="Download">

            <i class="fa-solid fa-download"></i>

        </a>

    {% else %}

        <!-- NOT LOGIN -->
        <a href="{% url 'index' %}?next={{ request.path }}"
           class="lb-login-download">

           Login to Download

        </a>

    {% endif %}

    <!-- LEFT -->
    <span class="lb-arrow left"
          onclick="changeImage(-1)">

          &#8592;

    </span>

    <!-- IMAGE -->
    <img id="lightbox-img"
         src=""
         alt="Preview">

    <!-- RIGHT -->
    <span class="lb-arrow right"
          onclick="changeImage(1)">

          &#8594;

    </span>

</div>

<script>

/* =========================
   IMAGES ARRAY
========================= */
let images = [];
let currentIndex = 0;

document.addEventListener('DOMContentLoaded', () => {

    images = Array.from(
        document.querySelectorAll('.gallery-item img')
    ).map(img => img.src);

});

/* =========================
   OPEN IMAGE
========================= */
function openImage(src){

    currentIndex = images.indexOf(src);

    if(currentIndex === -1){
        currentIndex = 0;
    }

    showImage(currentIndex);

    document
        .getElementById('lightbox')
        .classList
        .add('open');

    document.body.style.overflow = 'hidden';
}

/* =========================
   SHOW IMAGE
========================= */
function showImage(index){

    const img = document.getElementById('lightbox-img');

    const downloadBtn =
        document.getElementById('lb-download');

    const counter =
        document.getElementById('lb-counter');

    img.src = images[index];

    /* LOGIN users-ku மட்டும் */
    if(downloadBtn){
        downloadBtn.href = images[index];
    }

    counter.textContent =
        (index + 1) + ' / ' + images.length;
}

/* =========================
   CHANGE IMAGE
========================= */
function changeImage(direction){

    currentIndex =
        (currentIndex + direction + images.length)
        % images.length;

    showImage(currentIndex);
}

/* =========================
   CLOSE IMAGE
========================= */
function closeImage(){

    document
        .getElementById('lightbox')
        .classList
        .remove('open');

    document.body.style.overflow = '';
}

/* =========================
   KEYBOARD
========================= */
document.addEventListener('keydown', function(e){

    const lightbox =
        document.getElementById('lightbox');

    if(!lightbox.classList.contains('open')){
        return;
    }

    if(e.key === 'ArrowRight'){
        changeImage(1);
    }

    if(e.key === 'ArrowLeft'){
        changeImage(-1);
    }

    if(e.key === 'Escape'){
        closeImage();
    }

});

/* =========================
   MOBILE SWIPE
========================= */
let touchStartX = 0;

const lightbox =
    document.getElementById('lightbox');

lightbox.addEventListener('touchstart', function(e){

    touchStartX =
        e.changedTouches[0].screenX;

}, { passive:true });

lightbox.addEventListener('touchend', function(e){

    let touchEndX =
        e.changedTouches[0].screenX;

    let diff = touchStartX - touchEndX;

    if(Math.abs(diff) > 40){

        if(diff > 0){
            changeImage(1);
        }else{
            changeImage(-1);
        }
    }

});

</script>

</body>
</html>
